name: check

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.15", "3.14.7"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the separate recorded-codec Python
        id: codec-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Set up host Python
        id: host-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Set up Bun for the locked TypeScript contract test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Log host versions
        run: |
          python3 --version
          uv --version
          bun --version
          c++ --version
      - name: Prepare isolated locked Python environments
        run: >-
          make setup-digital
          UV_PYTHON="${{ steps.host-python.outputs.python-path }}"
          NEREID_PYTHON="${{ steps.codec-python.outputs.python-path }}"
      - name: Run non-skipping host gates
        # Codec and API integration use distinct locks; skips/empty suites fail.
        run: >-
          make verify-host
          UV_PYTHON="${{ steps.host-python.outputs.python-path }}"
          NEREID_PYTHON="${{ steps.codec-python.outputs.python-path }}"
      - name: Run C++ address and undefined-behavior sanitizers
        run: >-
          make test-firmware-sanitized test-firmware-native-sanitized
          UV_PYTHON="${{ steps.host-python.outputs.python-path }}"

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up browser-runner and API Python
        id: ui-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Set up uv for the isolated API environment
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Log UI runtime versions
        run: |
          python3 --version
          bun --version
      - name: Install the locked UI environment
        run: make setup-ui
      - name: Install project-pinned Chromium and OS libraries in this ephemeral runner
        # runner context is available in steps.env, not jobs.<job_id>.env.
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/poseidon-playwright
        # No bunx/latest lookup; only the installed lock-pinned Playwright Core CLI.
        run: bun "$GITHUB_WORKSPACE/apps/aeolus-ui/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Run guarded unit tests, types, build and full/native-auth browser workflows
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/poseidon-playwright
        run: make verify-ui UV_PYTHON="${{ steps.ui-python.outputs.python-path }}"

  cad-recompute:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up CAD Python
        id: cad-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Log bootstrap versions
        run: |
          python3 --version
          uv --version
      - name: Generate CAD and reexecute geometry checks in a fresh environment
        # Make logs installed CAD/OCP/VTK versions, then calls both actual tools.
        # Candidate gate is separate and NON-ADOPTED; it does not replace reference1.1.
        run: make verify-cad verify-cad-candidate CAD_PYTHON="${{ steps.cad-python.outputs.python-path }}"

  esp-compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up ESP build Python
        id: esp-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Log bootstrap versions
        run: |
          python3 --version
          uv --version
      - name: Compile and link the ESP reference without upload or device access
        # Fresh PlatformIO core/build/sdkconfig; IDF constraints are command-scoped.
        # Make logs PlatformIO packages and actual compiler/CMake/Ninja versions.
        run: make compile-esp compile-esp-monitor ESP_PYTHON="${{ steps.esp-python.outputs.python-path }}"

  digital:
    name: Bound digital gates (not release approval)
    if: ${{ always() }}
    needs: [python-host, ui, cad-recompute, esp-compile-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped gate jobs
        env:
          HOST_RESULT: ${{ needs.python-host.result }}
          UI_RESULT: ${{ needs.ui.result }}
          CAD_RESULT: ${{ needs.cad-recompute.result }}
          ESP_RESULT: ${{ needs.esp-compile-only.result }}
        run: |
          test "$HOST_RESULT" = success
          test "$UI_RESULT" = success
          test "$CAD_RESULT" = success
          test "$ESP_RESULT" = success
          printf '%s\n' 'Configured host/browser/CAD/reference and monitor compile gates passed. No release authorization.'
