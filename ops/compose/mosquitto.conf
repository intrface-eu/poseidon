# Local-only Compose listener; host publication is loopback in compose.json.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/private/passwords
acl_file /mosquitto/config/acl
cafile /mosquitto/private/ca.crt
certfile /mosquitto/private/server.crt
keyfile /mosquitto/private/server.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
max_queued_messages 1000
max_queued_bytes 1048576
message_size_limit 16384
max_inflight_messages 20
log_dest stdout
log_type error
log_type warning
connection_messages false
