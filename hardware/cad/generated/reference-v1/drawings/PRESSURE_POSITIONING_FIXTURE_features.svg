<text x="50" y="232" font-size="15" font-weight="normal">mount_hole_diameter_mm: 10.5</text>
<text x="50" y="255" font-size="15" font-weight="normal">No lid, seals, pressure fittings, pressure reaction frame or containment. Facility must approve materials, venting, buoyancy,</text>
