<text x="50" y="1336" font-size="15" font-weight="normal">mount_holes_verified: false</text>
<text x="35" y="1359" font-size="15" font-weight="bold">REEF-RADIO-ENV / BOM REEF-RF-001</text>
<text x="50" y="1382" font-size="15" font-weight="normal">size_mm: [40.0,30.0,15.0]</text>
<text x="50" y="1405" font-size="15" font-weight="normal">mount_holes_verified: false</text>
<text x="50" y="1428" font-size="15" font-weight="normal">source_id: &quot;SRC-RAK&quot;</text>
<text x="50" y="1451" font-size="15" font-weight="normal">documented_plan_mm: [25.4,32.3]</text>
<text x="50" y="1474" font-size="15" font-weight="normal">40x30x15 mm is a conservative provisional allocation. Source board/module wording and header/antenna height are unresolved; not</text>
<text x="50" y="1497" font-size="15" font-weight="normal">detailed vendor CAD.</text>
<text x="35" y="1520" font-size="15" font-weight="bold">REEF-CHARGE-ENV / BOM REEF-MPPT-001</text>
