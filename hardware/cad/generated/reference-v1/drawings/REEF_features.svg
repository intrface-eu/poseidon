<text x="50" y="738" font-size="15" font-weight="normal">source_id: &quot;SRC-VICTRON-SOLAR&quot;</text>
<text x="50" y="761" font-size="15" font-weight="normal">vendor_mass_kg: 3.1</text>
<text x="50" y="784" font-size="15" font-weight="normal">tilt_degrees_assumed: 0</text>
<text x="50" y="807" font-size="15" font-weight="normal">panel_overhang_from_support_y_mm: 42.5</text>
<text x="50" y="830" font-size="15" font-weight="normal">Primary PDF p1 verifies 425x668x25, rotated here. Historical drawing reference; current availability/obsolescence unresolved. No</text>
<text x="50" y="853" font-size="15" font-weight="normal">purchase approval.</text>
<text x="50" y="876" font-size="15" font-weight="normal">Horizontal packaging pose only, not an energy-optimal or wind-qualified installation. Clamp zones and junction box unresolved. Nominal</text>
<text x="50" y="899" font-size="15" font-weight="normal">support overhang 42.5 mm each Y side.</text>
<text x="35" y="922" font-size="15" font-weight="bold">CAD-REEF-BATTERY-SHELF-01 / BOM CAD-REEF-BATTERY-SHELF-01</text>
