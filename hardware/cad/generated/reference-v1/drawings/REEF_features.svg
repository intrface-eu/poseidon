<text x="50" y="1014" font-size="15" font-weight="normal">source_id: &quot;SRC-VICTRON-BATTERY&quot;</text>
<text x="50" y="1037" font-size="15" font-weight="normal">vendor_mass_kg: 7.0</text>
<text x="50" y="1060" font-size="15" font-weight="normal">terminal_thread: &quot;M8&quot;</text>
<text x="50" y="1083" font-size="15" font-weight="normal">Manual HxWxD199x188x147, mapped XYZ188x147x199. Drawing Rev01 and manual differ in detail; reconcile selected revision before</text>
<text x="50" y="1106" font-size="15" font-weight="normal">fabrication.</text>
<text x="50" y="1129" font-size="15" font-weight="normal">Upright pose. Terminal/lug positions, fuse, isolation, ventilation and rated restraint remain open. 7 kg vendor nominal mass, not</text>
<text x="50" y="1152" font-size="15" font-weight="normal">geometry-derived.</text>
<text x="35" y="1175" font-size="15" font-weight="bold">REEF-BOX-ENV / BOM REEF-ENC-001</text>
<text x="50" y="1198" font-size="15" font-weight="normal">Conservative cavity proxy; no ingress protection or fabrication claim</text>
<text x="35" y="1221" font-size="15" font-weight="bold">CAD-REEF-ELECTRONICS-TRAY-01 / BOM CAD-REEF-ELECTRONICS-TRAY-01</text>
<text x="50" y="1244" font-size="15" font-weight="normal">size_mm: [250,170,4]</text>
