; Compile-only reference. Hardware interface HW-REF-1.1 / MCU-01.
; No upload target or I/O driver is provided or authorized.
[platformio]
default_envs = reef_reference
boards_dir = boards
; Require a caller-owned absolute build path; see docs/firmware/runtime.md.
build_dir = ${sysenv.PLATFORMIO_BUILD_DIR}

[env:reef_reference]
platform = espressif32@6.9.0
board = esp32-devkitc-32e-reference
framework = espidf
board_build.esp-idf.sdkconfig_path = ${platformio.build_dir}/sdkconfig.reef_reference
board_build.partitions = partitions-reference.csv
platform_packages =
    platformio/framework-espidf@3.50301.0
    platformio/toolchain-xtensa-esp-elf@13.2.0+20240530
    platformio/tool-esptoolpy@1.40501.0
    platformio/toolchain-esp32ulp@1.23800.240113
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
    platformio/tool-cmake@3.16.4
    platformio/tool-ninja@${sysenv.POSEIDON_NINJA_VERSION}
    platformio/tool-scons@4.40801.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
