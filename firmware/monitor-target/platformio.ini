; Development monitor application. Compile only; no upload/physical execution authorized.
[platformio]
default_envs = monitor_disabled
boards_dir = ../reference/boards
build_dir = ${sysenv.PLATFORMIO_BUILD_DIR}

[env]
platform = espressif32@6.9.0
board = esp32-devkitc-32e-reference
framework = espidf
board_build.partitions = partitions-monitor.csv
platform_packages =
    platformio/framework-espidf@3.50301.0
    platformio/toolchain-xtensa-esp-elf@13.2.0+20240530
    platformio/tool-esptoolpy@1.40501.0
    platformio/toolchain-esp32ulp@1.23800.240113
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
    platformio/tool-cmake@3.16.4
    platformio/tool-ninja@${sysenv.POSEIDON_NINJA_VERSION}
    platformio/tool-scons@4.40801.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:monitor_disabled]
board_build.esp-idf.sdkconfig_path = ${platformio.build_dir}/sdkconfig.monitor_disabled
build_flags = ${env.build_flags} -DPOSEIDON_MONITOR_PERSISTED=0

[env:monitor_persisted]
board_build.esp-idf.sdkconfig_path = ${platformio.build_dir}/sdkconfig.monitor_persisted
build_flags = ${env.build_flags} -DPOSEIDON_MONITOR_PERSISTED=1
